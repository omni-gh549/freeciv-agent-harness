[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freeciv-agent-harness"
version = "0.1.0"
description = "Browser-free Freeciv-web controls and native game events for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["websockets>=15,<18"]

[project.optional-dependencies]
test = ["mcp>=1,<2"]

[project.scripts]
freeciv-harness = "freeciv_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freeciv_agent = ["profiles/*.json"]
